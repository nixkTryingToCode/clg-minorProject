# Render Blueprint: creates PostgreSQL + Spring Boot API (Docker) + static React site.
databases:
  - name: recruit-db
    plan: free
    databaseName: recruit
    user: recruit

services:
  - type: web
    name: recruit-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: recruit-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: recruit-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: recruit-db, property: database }
      - key: DB_USER
        fromDatabase: { name: recruit-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: recruit-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@recruit.local
      - key: ADMIN_PASSWORD
        sync: false        # optional – leave unset to use the default Admin@12345
      - key: DEMO_PASSWORD
        sync: false        # optional – leave unset to use the default Demo@1234
      - key: SEED_DEMO
        value: "true"
      - key: CORS_ORIGINS
        value: https://recruit-web-ok6s.onrender.com   # frontend origin allowed by the API

  - type: web
    name: recruit-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://recruit-api-w632.onrender.com   # baked into the bundle at build time
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
